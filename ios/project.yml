name: WindowsOnIPhone
options:
  bundleIdPrefix: com.windowsaufiphone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WindowsOnIPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: Sources/Resources
        buildPhase: resources
      - path: Sources/Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Windows
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Windows kann das Mikrofon deines iPhones als Audioeingang verwenden."
        NSLocalNetworkUsageDescription: "Windows nutzt das Netzwerk für Internetzugang und Datei-Freigaben."
        LSApplicationQueriesSchemes:
          - stikjit
          - stikdebug
          - sidestore
        CFBundleURLTypes:
          - CFBundleURLName: com.windowsaufiphone.app
            CFBundleURLSchemes:
              - windowsiphone
        CFBundleDocumentTypes:
          - CFBundleTypeName: Windows-Datei
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.data
              - public.content
              - public.disk-image
              - public.iso-image
              - com.windowsaufiphone.hvsparse
              - com.windowsaufiphone.firmware
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.windowsaufiphone.hvsparse
            UTTypeDescription: Windows Sparse-Image
            UTTypeConformsTo:
              - public.data
              - public.disk-image
            UTTypeTagSpecification:
              public.filename-extension:
                - hvsparse
          - UTTypeIdentifier: com.windowsaufiphone.firmware
            UTTypeDescription: UEFI Firmware
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - fd
        UIBackgroundModes:
          - audio
          - fetch
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: WindowsOnIPhone.entitlements
      properties:
        get-task-allow: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.windowsaufiphone.app
        PRODUCT_NAME: WindowsOnIPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/Native/WindowsiOS-Bridging-Header.h
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../core
          - $(PROJECT_DIR)/../host
          - $(PROJECT_DIR)/../devices
          - $(PROJECT_DIR)/deps/include
          - $(PROJECT_DIR)/Sources/Native
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios
          - $(PROJECT_DIR)/deps/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lwinvm
          - -lslirp
          - -lglib-2.0
          - -lintl
          - -lpcre2-8
          - -lffi
          - -lresolv
          - -liconv
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: SafariServices.framework
      - sdk: WebKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: GameController.framework
