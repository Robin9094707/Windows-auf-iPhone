name: Build IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WindowsOnIPhone.ipa
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 26 SDK for Liquid Glass)
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen || brew upgrade meson ninja pkg-config xcodegen || true
          meson --version; ninja --version; xcodegen --version

      - name: Cache iOS dependencies (glib, libffi, libslirp)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ios/deps
          key: ios-deps-v2-${{ hashFiles('scripts/build_ios_deps.sh') }}

      - name: Build iOS dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_ios_deps.sh

      - name: Build engine static library (libwinvm.a)
        run: |
          make -j"$(sysctl -n hw.ncpu)" ios-lib
          ls -lh build/ios/libwinvm.a

      - name: Fetch UEFI firmware (EDK2 ArmVirtQemu, BSD-2-Clause-Patent)
        run: |
          mkdir -p ios/Sources/Resources/Firmware
          OUT=ios/Sources/Resources/Firmware/edk2-aarch64-code.fd
          if brew install qemu >/dev/null 2>&1 && [ -f "$(brew --prefix qemu)/share/qemu/edk2-aarch64-code.fd" ]; then
            cp "$(brew --prefix qemu)/share/qemu/edk2-aarch64-code.fd" "$OUT"
          else
            curl -fL --retry 3 -o "$OUT" https://retrage.github.io/edk2-nightly/bin/RELEASEAARCH64_QEMU_EFI.fd
          fi
          ls -lh "$OUT"

      - name: Generate Xcode project
        run: |
          cd ios
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate --spec project.yml

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/WindowsOnIPhone.xcodeproj \
            -scheme WindowsOnIPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*(deprecated)?$|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          APP=build/DerivedData/Build/Products/Release-iphoneos/WindowsOnIPhone.app
          if ! grep -q "BUILD SUCCEEDED" build/xcodebuild.log || [ ! -f "$APP/WindowsOnIPhone" ]; then
            echo "::error::xcodebuild failed"
            grep -n -A3 "error:" build/xcodebuild.log | head -150
            tail -n 40 build/xcodebuild.log
            exit 1
          fi
          ls -lh "$APP/WindowsOnIPhone" "$APP"/*.fd "$APP"/henge-jit.js

      - name: Package IPA (ad-hoc signed with get-task-allow for StikDebug)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/WindowsOnIPhone.app Payload/
          codesign --force --sign - --timestamp=none \
            --entitlements ios/WindowsOnIPhone.entitlements \
            Payload/WindowsOnIPhone.app
          codesign -d --entitlements - Payload/WindowsOnIPhone.app || true
          zip -qry WindowsOnIPhone.ipa Payload
          ls -lh WindowsOnIPhone.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsOnIPhone-ipa
          path: WindowsOnIPhone.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish release (latest build for easy sideloading)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Neuester Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: WindowsOnIPhone.ipa
          body: |
            **Windows auf iPhone** – IPA zum Sideloaden (SideStore, AltStore, Sideloadly).
            Danach JIT über StikDebug aktivieren (Button in der App).
            Build #${{ github.run_number }} · Branch `${{ github.ref_name }}` · Commit ${{ github.sha }}
